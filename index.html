<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Sign-Flip Parity — Ganita Prakash Grade 8</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --white:#ffffff;
  --off:#f5f5f2;
  --light:#ebebea;
  --mid:#d0d0cc;
  --steel:#7a7a78;
  --iron:#3a3a38;
  --coal:#1a1a18;
  --black:#060608;
  --green:#0a8a40;
  --green-bg:#e8f5ec;
  --red:#c02020;
  --red-bg:#fae8e8;
  --amber:#b86800;
  --amber-bg:#fdf2e0;
  --sans:'Syne',system-ui,sans-serif;
  --mono:'DM Mono',ui-monospace,monospace;
}
html,body{width:100%;height:100%;overflow:hidden}
body{
  font-family:var(--sans);
  background:var(--white);
  color:var(--coal);
  -webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;
  position:fixed;inset:0;
}

/* ── HEADER ── */
.top{
  border-bottom:3px solid var(--coal);
  background:var(--coal);color:var(--white);
  display:flex;align-items:stretch;flex-shrink:0;height:46px;
}
.top-left{
  padding:0 18px;border-right:1px solid var(--iron);
  display:flex;align-items:center;gap:12px;min-width:180px;
}
.top-ch{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--steel);font-family:var(--mono)}
.top-title{font-size:17px;font-weight:800;color:var(--white);letter-spacing:-.02em}
.top-center{flex:1;padding:0 16px;display:flex;align-items:center;gap:12px}

/* number inputs */
.num-inputs{display:flex;gap:6px;align-items:center}
.ni-lbl{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--steel);font-family:var(--mono)}
.ni{
  width:44px;height:32px;text-align:center;
  background:var(--iron);border:1px solid var(--steel);border-radius:2px;
  font-family:var(--mono);font-size:15px;font-weight:700;
  color:var(--white);outline:none;transition:border-color .12s;
}
.ni:focus{border-color:var(--white)}
.rand-btn{
  padding:5px 10px;background:transparent;border:1px solid var(--steel);border-radius:2px;
  font-family:var(--mono);font-size:10px;font-weight:700;color:var(--steel);
  cursor:pointer;letter-spacing:.06em;transition:all .12s;
}
.rand-btn:hover{border-color:var(--white);color:var(--white)}

/* parity display */
.top-right{
  border-left:1px solid var(--iron);padding:0 14px;
  display:flex;align-items:center;gap:10px;
}
.parity-chip{
  padding:5px 14px;border-radius:2px;
  font-family:var(--mono);font-size:13px;font-weight:700;
  letter-spacing:.08em;transition:all .25s;
}
.parity-chip.even{background:var(--green-bg);color:var(--green);border:1px solid var(--green)}
.parity-chip.odd{background:var(--red-bg);color:var(--red);border:1px solid var(--red)}
.total-disp{font-family:var(--mono);font-size:22px;font-weight:700;color:var(--white);transition:color .25s;min-width:60px;text-align:right}

/* ── MAIN ── */
.main{
  flex:1;display:grid;
  grid-template-columns:1fr 320px;
  overflow:hidden;min-height:0;
}

/* ── LEFT: EXPRESSION ── */
.left{
  border-right:3px solid var(--coal);
  display:flex;flex-direction:column;overflow:hidden;
}

/* sign controls */
.sign-row{
  padding:12px 16px;border-bottom:1px solid var(--mid);
  background:var(--off);
  display:flex;align-items:center;justify-content:center;
  gap:8px;flex-shrink:0;
}
.sr-grp{display:flex;flex-direction:column;align-items:center;gap:4px}
.sr-lbl{font-size:8px;letter-spacing:.16em;text-transform:uppercase;color:var(--steel);font-family:var(--mono)}
.sign-btn{
  width:52px;height:52px;border-radius:2px;
  font-family:var(--mono);font-size:28px;font-weight:700;
  color:var(--coal);background:var(--white);
  border:2px solid var(--coal);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .15s;
}
.sign-btn:hover:not(.locked){background:var(--coal);color:var(--white);transform:translateY(-2px)}
.sign-btn:active:not(.locked){transform:scale(.93)}
.sign-btn.plus{color:var(--green)}
.sign-btn.minus{color:var(--red)}
.sign-btn.locked{cursor:default;border-color:var(--mid);color:var(--steel);background:var(--off)}
.sign-btn.locked:hover{transform:none;background:var(--off);color:var(--steel)}

/* expression canvas */
.expr-wrap{
  flex:1;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  padding:16px;
  background:var(--white);
}
.expr-canvas{
  display:flex;align-items:center;justify-content:center;
  gap:0;flex-wrap:wrap;
}
.et-op{
  font-family:var(--mono);font-size:28px;font-weight:700;
  padding:0 8px;align-self:center;
}
.et-op.plus{color:var(--green)}
.et-op.minus{color:var(--red)}
.et-grp{
  display:flex;flex-direction:column;align-items:center;gap:4px;
}
.et-lbl{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--steel);font-family:var(--mono)}
.et-val{font-family:var(--mono);font-size:36px;font-weight:800;color:var(--coal);line-height:1}
.et-sub{font-family:var(--mono);font-size:14px;font-weight:700;line-height:1}
.et-sub.pos{color:var(--green)}
.et-sub.neg{color:var(--red)}

/* flash bar */
.flash-bar{
  padding:10px 16px;border-top:1px solid var(--mid);
  background:var(--off);
  font-size:11px;color:var(--steel);font-family:var(--mono);
  line-height:1.6;min-height:48px;flex-shrink:0;
  transition:all .2s;
}
.flash-bar.lit{background:var(--amber-bg);border-top-color:var(--amber);color:var(--amber)}
.flash-bar strong{color:var(--coal)}

/* ── RIGHT: ALL 8 COMBOS ── */
.right{
  background:var(--off);display:flex;flex-direction:column;overflow:hidden;
}
.r-header{
  padding:10px 14px;border-bottom:1px solid var(--mid);
  font-size:8px;letter-spacing:.2em;text-transform:uppercase;color:var(--steel);
  font-family:var(--mono);flex-shrink:0;
}
.combo-grid{
  flex:1;overflow-y:auto;padding:10px;
  display:grid;grid-template-columns:1fr 1fr;gap:5px;
  scrollbar-width:thin;scrollbar-color:var(--mid) transparent;
}
.combo-cell{
  padding:7px 10px;
  border:1px solid var(--mid);
  display:flex;justify-content:space-between;align-items:center;
  font-family:var(--mono);font-size:11px;
  background:var(--white);
  transition:all .2s;border-radius:2px;
}
.combo-cell.even{border-left:3px solid var(--green)}
.combo-cell.odd{border-left:3px solid var(--red)}
.combo-cell.cur{box-shadow:0 0 0 2px var(--coal);background:var(--off);font-weight:700}
.cc-str{color:var(--iron)}
.cc-val.even{color:var(--green);font-weight:800}
.cc-val.odd{color:var(--red);font-weight:800}

/* insight */
.insight-strip{
  padding:10px 14px;border-top:1px solid var(--mid);
  background:var(--white);font-size:10px;color:var(--steel);font-family:var(--mono);
  line-height:1.65;flex-shrink:0;
}
.insight-strip strong{color:var(--coal)}
</style>
</head>
<body>

<div class="top">
  <div class="top-left">
    <div class="top-ch">Ch·05 §5.1</div>
    <div class="top-title">Sign-Flip Parity</div>
  </div>
  <div class="top-center">
    <div class="ni-lbl">Numbers:</div>
    <div class="num-inputs">
      <input class="ni" id="n0" type="number" value="3">
      <input class="ni" id="n1" type="number" value="4">
      <input class="ni" id="n2" type="number" value="5">
      <input class="ni" id="n3" type="number" value="6">
    </div>
    <button class="rand-btn" id="rand-btn">Random</button>
  </div>
  <div class="top-right">
    <div class="total-disp" id="total-disp">18</div>
    <div class="parity-chip even" id="parity-chip">EVEN</div>
  </div>
</div>

<div class="main">
  <div class="left">
    <!-- Sign controls -->
    <div class="sign-row">
      <div class="sr-grp">
        <span class="sr-lbl">a</span>
        <button class="sign-btn locked">+</button>
      </div>
      <div class="sr-grp">
        <span class="sr-lbl">flip b</span>
        <button class="sign-btn plus" id="s1">+</button>
      </div>
      <div class="sr-grp">
        <span class="sr-lbl">flip c</span>
        <button class="sign-btn plus" id="s2">+</button>
      </div>
      <div class="sr-grp">
        <span class="sr-lbl">flip d</span>
        <button class="sign-btn plus" id="s3">+</button>
      </div>
    </div>

    <!-- Expression canvas -->
    <div class="expr-wrap">
      <div class="expr-canvas" id="expr-canvas"></div>
    </div>

    <!-- Flash explanation -->
    <div class="flash-bar" id="flash-bar">Click a <strong>flip</strong> button above to see why parity never changes</div>
  </div>

  <div class="right">
    <div class="r-header">All 8 sign combinations — same parity every time</div>
    <div class="combo-grid" id="combo-grid"></div>
    <div class="insight-strip">
      All 8 totals share one parity. Changing signs shifts total by ±2×n — always even. <strong>Parity is an invariant.</strong>
    </div>
  </div>
</div>

<script>
const state={nums:[3,4,5,6],signs:[1,1,1,1],prevTotal:null};

for(let i=0;i<4;i++){
  document.getElementById('n'+i).addEventListener('change',e=>{
    const v=parseInt(e.target.value);
    if(!isNaN(v)){state.nums[i]=v;state.prevTotal=null;render();}
  });
}
document.getElementById('rand-btn').addEventListener('click',()=>{
  state.nums=Array.from({length:4},()=>Math.floor(Math.random()*15)+1);
  for(let i=0;i<4;i++)document.getElementById('n'+i).value=state.nums[i];
  state.prevTotal=null;state.signs=[1,1,1,1];
  document.querySelectorAll('#s1,#s2,#s3').forEach((b,i)=>{b.textContent='+';b.classList.remove('minus');b.classList.add('plus');});
  render();
});

[1,2,3].forEach(i=>{
  const btn=document.getElementById('s'+i);
  btn.addEventListener('click',()=>{
    state.prevTotal=computeTotal();
    state.signs[i]*=-1;
    btn.textContent=state.signs[i]===1?'+':'−';
    btn.classList.toggle('plus',state.signs[i]===1);
    btn.classList.toggle('minus',state.signs[i]===-1);
    render(true,i);
  });
});

function computeTotal(){return state.signs.reduce((a,s,i)=>a+s*state.nums[i],0);}

function render(flipped=false,flipIdx=null){
  const total=computeTotal();
  document.getElementById('total-disp').textContent=total;
  const isEven=total%2===0;
  const pc=document.getElementById('parity-chip');
  pc.className='parity-chip '+(isEven?'even':'odd');
  pc.textContent=isEven?'EVEN':'ODD';

  // Expression canvas
  const ec=document.getElementById('expr-canvas');
  ec.innerHTML='';
  state.nums.forEach((n,i)=>{
    if(i>0){
      const op=document.createElement('div');
      op.className='et-op '+(state.signs[i]===1?'plus':'minus');
      op.textContent=state.signs[i]===1?'+':'−';
      ec.appendChild(op);
    }
    const grp=document.createElement('div');grp.className='et-grp';
    const lbl=document.createElement('div');lbl.className='et-lbl';lbl.textContent='abcd'[i];
    const val=document.createElement('div');val.className='et-val';val.textContent=n;
    const sub=document.createElement('div');
    const contrib=state.signs[i]*n;
    sub.className='et-sub '+(contrib>=0?'pos':'neg');
    sub.textContent=contrib>=0?'+'+contrib:contrib;
    grp.appendChild(lbl);grp.appendChild(val);grp.appendChild(sub);
    ec.appendChild(grp);
  });

  // Flash
  if(flipped&&state.prevTotal!==null&&flipIdx!==null){
    const diff=total-state.prevTotal;
    const n=state.nums[flipIdx];
    const lbl='abcd'[flipIdx];
    const fb=document.getElementById('flash-bar');
    fb.className='flash-bar lit';
    fb.innerHTML=`Flipped sign of <strong>${lbl} = ${n}</strong>. Total: ${state.prevTotal} → ${total}. Change = <strong>±2 × ${n} = ${Math.abs(diff)}</strong>. Since 2×${n} is even, parity stays <strong>${isEven?'EVEN':'ODD'}</strong>.`;
  }

  // All 8 combos
  const grid=document.getElementById('combo-grid');
  grid.innerHTML='';
  for(let mask=0;mask<8;mask++){
    const sg=[1,mask&4?-1:1,mask&2?-1:1,mask&1?-1:1];
    const val=sg.reduce((a,s,i)=>a+s*state.nums[i],0);
    const str=state.nums.map((n,i)=>(i===0?'':sg[i]===1?'+':'−')+n).join('');
    const isCur=sg.every((s,i)=>s===state.signs[i]);
    const ev=val%2===0;
    const cell=document.createElement('div');
    cell.className='combo-cell '+(ev?'even':'odd')+(isCur?' cur':'');
    cell.innerHTML=`<span class="cc-str">${str}</span><span class="cc-val ${ev?'even':'odd'}">${val}</span>`;
    grid.appendChild(cell);
  }
}

render();
</script>
</body>
</html>
